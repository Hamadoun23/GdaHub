# Les applications que GDA Hub rassemble.
#
# Elles ne sont pas des services du hub : ce sont des applications completes,
# qui tournent deja en production sur leur propre domaine et qui continueront
# de le faire. Le hub ne fait que les servir sous une seule origine et leur
# apporter un compte unique.
#
# D'ou ce fichier separe : le jour ou l'une d'elles quitte le hub, on retire
# son bloc, et rien d'autre ne bouge.
#
# Le code n'est pas duplique. Chaque application est montee depuis son depot
# d'origine, la ou elle vit deja :
#
#   ../FinanceRH                       FinanceRH   (rh.gdamali.net)
#   ../FinanceRH/DocsERP/Orange-full2  Jus d'orange (jus.gdamali.net)
#   ../FinanceRH/DocsERP/BDM           BDM          (bdm.gdamali.net)
#
# Les deux dernieres vivent aujourd'hui dans DocsERP ; leur place naturelle
# serait a cote de GdaHub, mais les deplacer casserait les chemins du depot
# FinanceRH. A traiter separement.
#
# Demarrage : ce fichier est joint au principal par COMPOSE_FILE, dans .env.
# Un « docker compose up -d » suffit donc, sans option supplementaire.

services:
  # --- FinanceRH -----------------------------------------------------------
  # Servie sous /rh/. Sa base lui appartient : le hub n'y touche jamais.
  financerh-db:
    # La meme image, le meme role et le meme nom de base qu'en production :
    # une sauvegarde s'y restaure telle quelle, sans reecriture. Le compose de
    # developpement de FinanceRH utilise l'image Supabase ; ici c'est la
    # production qu'on reproduit, pas le poste du developpeur.
    image: postgres:17-alpine
    container_name: gdahub-financerh-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: financerh
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gdahub-local}
      POSTGRES_DB: financerh
    volumes:
      - donnees-financerh:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financerh -d financerh"]
      interval: 5s
      timeout: 5s
      retries: 30

  financerh-api:
    build:
      context: ../FinanceRH/backend
      target: developpement
    container_name: gdahub-financerh-api
    restart: unless-stopped
    depends_on:
      financerh-db: {condition: service_healthy}
      identity: {condition: service_started}
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-developpement-local-non-secret}
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0,gateway,financerh-api
      DJANGO_TIME_ZONE: Africa/Bamako
      DATABASE_URL: postgres://financerh:${POSTGRES_PASSWORD:-gdahub-local}@financerh-db:5432/financerh
      # Le rattachement au compte unique. Absente en production, cette
      # variable laisse FinanceRH avec sa seule connexion maison.
      GDAHUB_JWKS_URL: http://identity:8000/.well-known/jwks.json
      GDAHUB_JETON_EMETTEUR: gdahub-identity
      GDAHUB_JETON_AUDIENCE: gdahub
      # Les justificatifs sont servis en adresse absolue : sans ce prefixe,
      # ils pointeraient hors de /rh/ et tomberaient sur la coquille du hub.
      MEDIA_URL: /rh/media/
    volumes:
      - ../FinanceRH/backend:/app
      - /app/.venv
      - media-financerh:/app/media
    ports: ["127.0.0.1:8110:8000"]

  financerh-web:
    build:
      context: ../FinanceRH/frontend
      target: developpement
    container_name: gdahub-financerh-web
    restart: unless-stopped
    depends_on: [financerh-api]
    environment:
      # Servie sous /rh/ : Next prefixe ses propres routes, et l'API est
      # jointe par la passerelle sur le meme chemin. Aucune requete ne sort
      # de l'origine du hub, donc aucun CORS.
      NEXT_PUBLIC_CHEMIN_BASE: /rh
      NEXT_PUBLIC_API_URL: /rh/api
      WATCHPACK_POLLING: "true"
    volumes:
      - ../FinanceRH/frontend:/app
      - /app/node_modules
      - /app/.next
    ports: ["127.0.0.1:3110:3000"]

  # --- Jus d'orange --------------------------------------------------------
  # Servie sous /jus/. Meme forme que FinanceRH : un front Next, une API
  # Django, sa propre base.
  jusorange-db:
    # 16, comme en production : c'est la version qui a produit les
    # sauvegardes, et restaurer dans la meme evite les surprises.
    image: postgres:16-alpine
    container_name: gdahub-jusorange-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: jusorange
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gdahub-local}
      POSTGRES_DB: jusorange
    volumes:
      - donnees-jusorange:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jusorange -d jusorange"]
      interval: 5s
      timeout: 5s
      retries: 30

  jusorange-api:
    build:
      context: ../FinanceRH/DocsERP/Orange-full2/back
      target: developpement
    container_name: gdahub-jusorange-api
    restart: unless-stopped
    depends_on:
      jusorange-db: {condition: service_healthy}
      identity: {condition: service_started}
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-developpement-local-non-secret}
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0,gateway,jusorange-api
      DATABASE_URL: postgres://jusorange:${POSTGRES_PASSWORD:-gdahub-local}@jusorange-db:5432/jusorange
      GDAHUB_JWKS_URL: http://identity:8000/.well-known/jwks.json
      GDAHUB_JETON_EMETTEUR: gdahub-identity
      GDAHUB_JETON_AUDIENCE: gdahub
      # Les photos de prospection sont servies en adresse absolue.
      MEDIA_URL: /jus/media/
    volumes:
      - ../FinanceRH/DocsERP/Orange-full2/back:/app
      - media-jusorange:/app/media
    ports: ["127.0.0.1:8120:8000"]

  jusorange-web:
    build:
      context: ../FinanceRH/DocsERP/Orange-full2/front
      target: developpement
    container_name: gdahub-jusorange-web
    restart: unless-stopped
    depends_on: [jusorange-api]
    environment:
      NEXT_PUBLIC_CHEMIN_BASE: /jus
      NEXT_PUBLIC_API_URL: /jus/api
      WATCHPACK_POLLING: "true"
    volumes:
      - ../FinanceRH/DocsERP/Orange-full2/front:/app
      - /app/node_modules
      - /app/.next
    ports: ["127.0.0.1:3120:3000"]

  # --- BDM -----------------------------------------------------------------
  # Servie sous /bdm/. Forme differente : Django sert lui-meme les pages React
  # par Inertia, et l'identite tient dans une session, pas dans un jeton.
  bdm-db:
    image: mysql:8.0
    container_name: gdahub-bdm-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${POSTGRES_PASSWORD:-gdahub-local}
      MYSQL_DATABASE: bdm
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - donnees-bdm-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  bdm-app:
    build:
      context: ../FinanceRH/DocsERP/BDM
      dockerfile: backend/Dockerfile
    container_name: gdahub-bdm-app
    restart: unless-stopped
    depends_on:
      bdm-db: {condition: service_healthy}
      identity: {condition: service_started}
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-developpement-local-non-secret}
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0,gateway,bdm-app
      DB_HOST: bdm-db
      DB_PORT: "3306"
      DB_NAME: bdm
      DB_USER: root
      DB_PASSWORD: ${POSTGRES_PASSWORD:-gdahub-local}
      # Django sert ses propres pages : il doit savoir sous quel chemin, sinon
      # chaque redirection sortirait du perimetre de l'application.
      CHEMIN_BASE: /bdm
      # Sous une origine unique, deux Django qui posent « sessionid » se
      # deconnecteraient mutuellement.
      SESSION_COOKIE_NAME: bdm_sessionid
      CSRF_COOKIE_NAME: bdm_csrftoken
      GDAHUB_JWKS_URL: http://identity:8000/.well-known/jwks.json
      GDAHUB_JETON_EMETTEUR: gdahub-identity
      GDAHUB_JETON_AUDIENCE: gdahub
    volumes:
      - ../FinanceRH/DocsERP/BDM/backend:/app
      - media-bdm-app:/app/media
      - statiques-bdm:/app/staticfiles
    ports: ["127.0.0.1:8130:8000"]

volumes:
  donnees-financerh:
  media-financerh:
  donnees-jusorange:
  media-jusorange:
  donnees-bdm-mysql:
  media-bdm-app:
  statiques-bdm:
