# Passerelle de GDA Hub.
#
# Elle donne au navigateur une seule origine : http://localhost:8080. Le shell
# React et les cinq services sont derriere, sur le reseau Docker, et aucun
# n'est joignable directement en production.
#
# L'interet n'est pas seulement cosmetique : une origine unique supprime le
# CORS, et le jour ou un service est deplace, c'est une ligne a changer ici
# plutot qu'un deploiement du front.

upstream identity  { server identity:8000; }
upstream bdm       { server bdm:8000; }
upstream orange    { server orange:8000; }
upstream daily     { server daily:8000; }
upstream planning  { server planning:8000; }
upstream shell     { server web:3000; }

server {
    listen 80;
    server_name _;

    # Les exports Excel et les photos de chantier passent par la ; la limite
    # par defaut de nginx (1 Mo) est trop basse pour eux.
    client_max_body_size 25m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;

    # --- Services -----------------------------------------------------------
    # Le prefixe est conserve : chaque service repond bien sur /api/<code>/,
    # ce qui rend les journaux lisibles et les routes identiques des deux
    # cotes de la passerelle.

    location /api/identity/ { proxy_pass http://identity; }
    location /api/bdm/      { proxy_pass http://bdm; }
    location /api/orange/   { proxy_pass http://orange; }
    location /api/daily/    { proxy_pass http://daily; }
    location /api/planning/ { proxy_pass http://planning; }

    # Cle publique de signature : lue par les services entre eux, et par
    # n'importe qui — elle est publique par construction.
    location /.well-known/jwks.json { proxy_pass http://identity; }

    # Administration Django d'identity, utile en developpement.
    location /admin/  { proxy_pass http://identity; }
    location /static/ { proxy_pass http://identity; }

    # --- Sondes -------------------------------------------------------------
    location = /sante/identity { proxy_pass http://identity/sante; }
    location = /sante/bdm      { proxy_pass http://bdm/sante; }
    location = /sante/orange   { proxy_pass http://orange/sante; }
    location = /sante/daily    { proxy_pass http://daily/sante; }
    location = /sante/planning { proxy_pass http://planning/sante; }

    # --- Shell React --------------------------------------------------------
    # Tout le reste appartient a Next. Le bloc Upgrade sert au rechargement a
    # chaud en developpement : sans lui, le navigateur reconstruit la page a
    # chaque modification.
    location / {
        proxy_pass http://shell;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
