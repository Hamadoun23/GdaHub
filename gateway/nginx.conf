# Passerelle de GDA Hub.
#
# Elle donne au navigateur une seule origine : http://localhost:8080. Le shell
# React et les neuf services sont derriere, sur le reseau Docker, et aucun
# n'est joignable directement en production.
#
# L'interet n'est pas seulement cosmetique : une origine unique supprime le
# CORS, et le jour ou un service est deplace, c'est une ligne a changer ici
# plutot qu'un deploiement du front.

# --- Le compte unique -------------------------------------------------------
#
# Les applications rassemblees ne savent pas aller chercher un jeton chez le
# hub : FinanceRH et Jus d'orange ont leur propre front, BDM sert ses pages
# depuis Django. La passerelle fait le pont — elle lit le cookie pose par
# `identity` a la connexion et le presente comme un en-tete `Authorization`.
#
# Le cookie reste HttpOnly : aucun script de page ne le voit.
#
# **L'en-tete du client prime toujours.** Une application ouverte seule, avec
# sa propre connexion, envoie son propre jeton : l'ecraser la deconnecterait.
# Le cookie ne sert que lorsque le client n'a rien presente.
map $cookie_gdahub_acces $autorisation_du_hub {
    default  "Bearer $cookie_gdahub_acces";
    ""       "";
}
map $http_authorization $autorisation {
    default  $http_authorization;
    ""       $autorisation_du_hub;
}

upstream identity     { server identity:8000; }

# Board — le siege.
upstream organisation { server organisation:8000; }
upstream rh           { server rh:8000; }
upstream finance      { server finance:8000; }
upstream direction    { server direction:8000; }

# Les quatre applications metier.
upstream bdm          { server bdm:8000; }
upstream orange       { server orange:8000; }
upstream daily        { server daily:8000; }
upstream planning     { server planning:8000; }

upstream shell        { server web:3000; }

# --- Les applications rassemblees ------------------------------------------
# Elles ne sont pas des services du hub : chacune a son front et son back, et
# tourne aussi bien sans lui.
upstream financerh_api  { server financerh-api:8000; }
upstream financerh_web  { server financerh-web:3000; }
upstream jusorange_api  { server jusorange-api:8000; }
upstream jusorange_web  { server jusorange-web:3000; }
upstream bdm_app        { server bdm-app:8000; }

server {
    listen 80;
    server_name _;

    # Les exports Excel et les photos de chantier passent par la ; la limite
    # par defaut de nginx (1 Mo) est trop basse pour eux.
    client_max_body_size 25m;

    proxy_http_version 1.1;
    # `$http_host` et non `$host` : le second retire le port, et Django compare
    # l'en-tete Origin (« http://localhost:8080 ») a l'hote de la requete.
    # Sans le port, toute soumission de formulaire echoue sur la protection
    # CSRF, a commencer par la connexion a l'administration.
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;

    # --- Services -----------------------------------------------------------
    # Le prefixe est conserve : chaque service repond bien sur /api/<code>/,
    # ce qui rend les journaux lisibles et les routes identiques des deux
    # cotes de la passerelle.

    location /api/identity/     { proxy_pass http://identity; }

    location /api/organisation/ { proxy_pass http://organisation; }
    location /api/rh/           { proxy_pass http://rh; }
    location /api/finance/      { proxy_pass http://finance; }
    location /api/direction/    { proxy_pass http://direction; }

    location /api/bdm/          { proxy_pass http://bdm; }
    location /api/orange/       { proxy_pass http://orange; }
    location /api/daily/        { proxy_pass http://daily; }
    location /api/planning/     { proxy_pass http://planning; }

    # Cle publique de signature : lue par les services entre eux, et par
    # n'importe qui — elle est publique par construction.
    location /.well-known/jwks.json { proxy_pass http://identity; }

    # Administration Django d'identity, utile en developpement.
    # --- FinanceRH, servie sous /rh/ ---------------------------------------
    #
    # L'ordre n'est pas indifferent : nginx retient le prefixe le plus long,
    # donc /rh/api/ l'emporte sur /rh/. Sans cela, Next recevrait les appels
    # d'API et repondrait 404 sur chacun.
    #
    # La barre oblique finale du proxy_pass remplace le prefixe : /rh/api/x
    # arrive en /api/x cote Django, qui ignore tout du chemin sous lequel il
    # est servi.
    location /rh/api/ {
        proxy_pass http://financerh_api/api/;
        include /etc/nginx/entetes-proxy.conf;
        proxy_set_header Authorization $autorisation;
    }

    # Les pieces jointes. Django ne les sert qu'en mode debogage : elles
    # viennent du volume, comme celles des autres services.
    location /rh/media/ { alias /var/media/financerh/; access_log off; }

    location /rh/ {
        proxy_pass http://financerh_web;
        include /etc/nginx/entetes-proxy.conf;
        # Le rechargement a chaud de Next passe par une liaison persistante.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    # « /rh » sans barre finale est transmis tel quel, jamais redirige : avec
    # un basePath, Next sert sa page d'accueil a cette adresse exacte, et lui
    # renvoyer « /rh/ » ferait tourner le navigateur en rond.
    location = /rh {
        proxy_pass http://financerh_web;
        include /etc/nginx/entetes-proxy.conf;
    }

    # --- Jus d'orange, servie sous /jus/ -----------------------------------
    # Meme forme que FinanceRH, donc meme decoupage.
    location /jus/api/ {
        proxy_pass http://jusorange_api/api/;
        include /etc/nginx/entetes-proxy.conf;
        proxy_set_header Authorization $autorisation;
    }
    location /jus/media/ { alias /var/media/jusorange/; access_log off; }

    location /jus/ {
        proxy_pass http://jusorange_web;
        include /etc/nginx/entetes-proxy.conf;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    location = /jus {
        proxy_pass http://jusorange_web;
        include /etc/nginx/entetes-proxy.conf;
    }

    # --- BDM, servie sous /bdm/ -------------------------------------------
    #
    # Forme differente : Django sert lui-meme les pages React par Inertia, il
    # n'y a donc pas de front separe.
    #
    # Le prefixe **est retire** par la barre oblique finale du proxy_pass, et
    # rendu a Django par l'en-tete `X-Script-Name` que lit son reglage
    # `FORCE_SCRIPT_NAME`. Les deux sont necessaires et jouent chacun leur
    # role : Django *resout* les routes sur le chemin nu (« /dashboard ») et
    # *fabrique* ses adresses avec le prefixe (« /bdm/dashboard »). Laisser le
    # prefixe dans le chemin transmis le ferait compter deux fois — Django
    # cherchait « /bdm/bdm/ » et repondait 404.
    location /bdm/ {
        proxy_pass http://bdm_app/;
        include /etc/nginx/entetes-proxy.conf;
        proxy_set_header Authorization $autorisation;
    }
    location = /bdm { return 308 /bdm/; }

    # Les fichiers de BDM, servis depuis les volumes plutot que par Django.
    location /bdm/static/  { alias /var/statiques/bdm/; access_log off; }
    location /bdm/storage/ { alias /var/media/bdm/;     access_log off; }

    location /admin/  { proxy_pass http://identity; }
    location /static/ { proxy_pass http://identity; }

    # Les fichiers deposes — photos de chantier, justificatifs d'absence, pieces
    # comptables. Ils sont servis depuis les volumes des services plutot que par
    # Django : celui-ci ne sert les fichiers qu'en mode debogage, et une piece
    # justificative qui disparait en production serait un defaut invisible.
    location /media/rh/      { alias /var/media/rh/;      access_log off; }
    location /media/finance/ { alias /var/media/finance/; access_log off; }
    location /media/daily/   { alias /var/media/daily/;   access_log off; }

    # --- Sondes -------------------------------------------------------------
    location = /sante/identity     { proxy_pass http://identity/sante; }
    location = /sante/organisation { proxy_pass http://organisation/sante; }
    location = /sante/rh           { proxy_pass http://rh/sante; }
    location = /sante/finance      { proxy_pass http://finance/sante; }
    location = /sante/direction    { proxy_pass http://direction/sante; }
    location = /sante/bdm          { proxy_pass http://bdm/sante; }
    location = /sante/orange       { proxy_pass http://orange/sante; }
    location = /sante/daily        { proxy_pass http://daily/sante; }
    location = /sante/planning     { proxy_pass http://planning/sante; }

    # --- Shell React --------------------------------------------------------
    # Tout le reste appartient a Next. Le bloc Upgrade sert au rechargement a
    # chaud en developpement : sans lui, le navigateur reconstruit la page a
    # chaque modification.
    location / {
        proxy_pass http://shell;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
